<title>Pet Mignon - かわいいペット管理</title>
<style>
:root{
  --pink:#ff8fb7; --pink2:#ffd6e6; --cream:#fffaf5; --mint:#bdebd9; --sky:#ccecff;
  --ink:#4e4050; --muted:#877986; --card:#ffffffdd; --shadow:0 14px 38px rgba(115,78,101,.14);
  --radius:26px;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:#fff6fb}
body{overflow-x:hidden}

header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;max-width:980px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:18px;background:linear-gradient(145deg,#fff,#ffd5e5);display:grid;place-items:center;box-shadow:0 8px 22px #d988a344;border:1px solid #fff;font-size:26px}.brand h1{font-size:22px;margin:0;letter-spacing:.02em}.brand p{font-size:12px;margin:2px 0 0;color:var(--muted)}
main{max-width:980px;margin:auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.hero{background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,244,249,.18));border:1px solid rgba(255,255,255,.72);border-radius:32px;box-shadow:0 12px 28px rgba(115,78,101,.08);padding:18px;position:relative;overflow:hidden;backdrop-filter:blur(10px)}.hero:after{content:"🐶  🐱";position:absolute;right:16px;top:10px;font-size:42px;opacity:.16;transform:rotate(-8deg)}

.section{margin-top:28px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,250,252,.14));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.70);border-radius:var(--radius);box-shadow:0 12px 28px rgba(115,78,101,.08);padding:16px}.section h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.muted{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,248,251,.14));border:1px solid rgba(245,218,229,.8);border-radius:19px;padding:13px;backdrop-filter:blur(8px)}.stat .label{font-size:11px;color:var(--muted)}.stat strong{font-size:18px;display:block;margin-top:3px}

button,.btn{border:0;font:inherit}.btn{cursor:pointer;border-radius:16px;padding:12px 14px;background:linear-gradient(145deg,#ff9fc1,#ff7eac);color:#fff;font-weight:700;box-shadow:0 8px 18px #ff8eb54c;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:active{transform:translateY(1px);box-shadow:0 4px 10px #ff8eb53b}.btn.sub{background:linear-gradient(145deg,#fff,#fff4f8);color:#a35775;border:1px solid #f4cada;box-shadow:0 7px 15px #96637616}.btn.mint{background:linear-gradient(145deg,#9bd8c2,#72c5a8);box-shadow:0 8px 18px #62b79c45}.btn.full{width:100%}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:120px}
.form{display:grid;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px;color:#745f6b}.field input,.field select{width:100%;border:1px solid rgba(238,217,226,.92);border-radius:15px;padding:12px 13px;background:rgba(255,255,255,.56);font-size:16px;outline:none;backdrop-filter:blur(6px)}.field input:focus,.field select:focus{border-color:#ef9dba;box-shadow:0 0 0 3px #ffd9e755}
.weight-form{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px}.weight-form input{min-width:0}
.chart-wrap{height:230px;position:relative;margin-top:8px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,250,253,.10));border-radius:18px;border:1px solid rgba(245,227,234,.85);overflow:hidden;backdrop-filter:blur(8px)}.chart-wrap svg{width:100%;height:100%;display:block}.history{display:grid;gap:9px;margin-top:12px;max-height:190px;overflow:auto}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(244,229,235,.85);border-radius:14px;padding:9px 10px;font-size:13px;backdrop-filter:blur(8px)}.delete{background:rgba(255,240,244,.72);color:#c95a80;border-radius:10px;padding:7px 9px;cursor:pointer}
.bottom{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(96%,620px);background:#fffffff2;border:1px solid #fff;border-radius:24px;box-shadow:0 14px 36px #68495a2d;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;backdrop-filter:blur(18px)}.navbtn{padding:8px 2px;border-radius:17px;background:transparent;color:#796974;font-size:10px;line-height:1.2;cursor:pointer}.navbtn span{display:block;font-size:21px;margin-bottom:2px}.navbtn.active{background:#fff0f6;color:#b24d74;font-weight:700}
.modal{position:fixed;inset:0;background:#49374455;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(100%,620px);max-height:92vh;overflow:auto;background:#fffafc;border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px #39233133}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h3{margin:0}.close{width:36px;height:36px;border-radius:50%;background:#f7eaf0;color:#7f6974;font-size:20px;cursor:pointer}.photo-preview{width:94px;height:94px;border-radius:26px;object-fit:cover;background:#fff0f6;display:grid;place-items:center;font-size:45px;margin:auto}.danger{background:#fff1f4;color:#c24f76;border:1px solid #f5c7d7}
.view{display:none}.view.active{display:block}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.page-head h2{font-size:22px;margin:0}.page-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.page-pet{display:flex;align-items:center;gap:10px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,248,251,.12));border:1px solid rgba(245,223,232,.85);border-radius:18px;padding:10px 12px;margin-bottom:14px;backdrop-filter:blur(8px)}.page-pet img,.page-pet .page-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:rgba(255,240,246,.82);display:grid;place-items:center;font-size:23px}.page-pet b{display:block;font-size:14px}.page-pet small{color:var(--muted);font-size:11px}.view .section{margin-top:0}.view-stack{display:grid;gap:18px}
.medical-list{display:grid;gap:12px;margin-top:12px}.medical-card{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,249,252,.12));border:1px solid rgba(245,223,232,.85);border-radius:18px;padding:13px;box-shadow:0 7px 16px rgba(118,85,107,.08);backdrop-filter:blur(8px)}.medical-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.medical-title{font-weight:800;font-size:15px}.medical-date{font-size:12px;color:var(--muted);margin-top:3px}.status-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.status-badge.plan{background:rgba(255,240,201,.82);color:#9a6c00}.status-badge.done{background:rgba(232,247,240,.82);color:#2e7f65}.medical-info{display:grid;gap:5px;margin-top:10px;font-size:13px}.medical-info a{color:#a84f74;text-decoration:none;font-weight:700}.medical-note{margin-top:8px;padding:9px 10px;background:rgba(255,247,250,.60);border-radius:12px;color:#695964;font-size:12px;white-space:pre-wrap}.medical-actions{display:flex;gap:8px;margin-top:10px}.medical-actions button{flex:1}.mini-btn{border-radius:12px;padding:9px 10px;background:rgba(255,242,247,.70);color:#a45173;font-weight:700;cursor:pointer;border:1px solid rgba(241,207,221,.9)}.mini-btn.delete-care{color:#c24f76;background:rgba(255,241,244,.72)}
@media(min-width:760px){#homeView{display:none}#homeView.active{display:grid;grid-template-columns:1fr 1fr;gap:16px}#homeView .hero{grid-column:1/-1}#homeView .section{margin-top:0}.profile{grid-template-columns:130px 1fr}.profile-photo{width:130px;height:130px}.bottom{width:520px}.navbtn{font-size:11px}}

<body>
<div class="bg"></div>
<header><div class="brand"><div class="logo">🐾</div><div><h1>Pet Mignon</h1><p>たいせつな家族を、かわいくまとめて管理</p></div></div></header>
<main>
  <div class="view active" id="homeView">
    <section class="hero page-card home-theme">
      <div class="pet-strip" id="petStrip"></div>
      <div id="profileArea"></div>
    </section>

    <section class="section page-card profile-theme" id="infoSection">
      <h3>💗 プロフィール</h3>
      <div class="grid2" id="profileStats"></div>
      <div class="actions"><button class="btn sub full" id="editPetBtn">✏️ プロフィールを編集</button></div>
    </section>
  </div>

  <div class="view" id="weightView">
    <div class="page-head"><div><h2>⚖️ 体重管理</h2><p>体重の記録と推移を確認</p></div></div>
    <div id="weightPetSummary" class="page-pet weight-pet"></div>
    <section class="section page-card weight-theme" id="weightSection">
      <h3>📈 体重のきろく <span class="muted">推移をグラフで確認</span></h3>
      <div class="weight-form">
        <div class="field"><input id="weightInput" type="number" step="0.01" min="0" placeholder="例 4.25" /></div>
        <div class="field"><input id="weightDate" type="date" /></div>
        <button class="btn mint" id="addWeightBtn">記録</button>
      </div>
      <div class="chart-wrap" id="chartWrap"></div>
      <div class="history" id="weightHistory"></div>
    </section>
  </div>

  <div class="view" id="careView">
    <div class="page-head"><div><h2>💉 ワクチン・通院</h2><p>接種・診察・予定をまとめて管理</p></div></div>
    <div id="carePetSummary" class="page-pet care-pet"></div>
    <section class="section page-card care-theme" id="careSection">
      <button class="btn full" id="addCareBtn">＋ 予定・記録を追加</button>
      <div class="medical-list" id="careList"></div>
    </section>
  </div>
</main>

<nav class="bottom">
  <button class="navbtn active" id="navHome"><span>🏠</span>ホーム</button>
  <button class="navbtn" id="navAdd"><span>🐾</span>ペット追加</button>
  <button class="navbtn" id="navWeight"><span>📈</span>体重</button>
  <button class="navbtn" id="navCare"><span>💉</span>ワクチン・通院</button>
</nav>

<div class="modal" id="petModal" aria-hidden="true"><div class="sheet">
  <div class="sheet-head"><h3 id="modalTitle">ペットを登録</h3><button class="close" id="closeModal">×</button></div>
  <form class="form" id="petForm">
    <div class="photo-preview" id="photoPreview">🐶</div>
    <div class="field"><label>写真</label><input id="petPhoto" type="file" accept="image/*" /></div>
    <div class="grid2">
      <div class="field"><label>名前 *</label><input id="petName" maxlength="30" required placeholder="モカ" /></div>
      <div class="field"><label>種類</label><select id="petType"><option>犬</option><option>猫</option><option>うさぎ</option><option>鳥</option><option>ハムスター</option><option>その他</option></select></div>
    </div>
    <div class="field"><label>生年月日</label><input id="petBirthday" type="date" /></div>
    <div class="field"><label>好きな食べ物</label><input id="petFood" maxlength="80" placeholder="ささみ、りんご など" /></div>
    <div class="field"><label>ひとことメモ</label><input id="petMemo" maxlength="100" placeholder="性格や注意点など" /></div>
    <button class="btn full" type="submit">💾 保存する</button>
    <button class="btn full danger" type="button" id="deletePetBtn" style="display:none">このペットを削除</button>
  </form>
</div></div>

<div class="modal" id="careModal" aria-hidden="true"><div class="sheet">
  <div class="sheet-head"><h3 id="careModalTitle">予定・記録を追加</h3><button class="close" id="closeCareModal">×</button></div>
  <form class="form" id="careForm">
    <div class="grid2">
      <div class="field"><label>予定 / 記録 *</label><select id="careStatus"><option value="予定">予定</option><option value="記録済み">記録済み</option></select></div>
      <div class="field"><label>内容 *</label><select id="careType"><option>ワクチン接種</option><option>通院</option><option>健康診断</option><option>投薬</option><option>予防薬</option><option>その他</option></select></div>
    </div>
    <div class="field"><label>日時 *</label><input id="careDate" type="datetime-local" required /></div>
    <div class="field"><label>病院名</label><input id="hospitalName" maxlength="80" placeholder="○○動物病院" /></div>
    <div class="field"><label>病院の住所</label><input id="hospitalAddress" maxlength="160" placeholder="静岡県…" /></div>
    <div class="field"><label>病院の電話番号</label><input id="hospitalPhone" type="tel" maxlength="30" placeholder="0544-xx-xxxx" /></div>
    <div class="field"><label>メモ</label><input id="careMemo" maxlength="200" placeholder="接種したワクチン名、症状、先生からの指示など" /></div>
    <button class="btn full" type="submit">💾 保存する</button>
    <button class="btn full danger" type="button" id="deleteCareBtn" style="display:none">この予定・記録を削除</button>
  </form>
</div></div>

<script>
const KEY='petMignonData_v1';
let state={pets:[],selected:null};
let editingId=null, pendingPhoto='', editingCareId=null;
const $=s=>document.querySelector(s);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.pets))state=x}catch{};state.pets.forEach(p=>{p.weights=Array.isArray(p.weights)?p.weights:[];p.care=Array.isArray(p.care)?p.care:[]});if(!state.selected&&state.pets[0])state.selected=state.pets[0].id}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function petEmoji(t){return ({'犬':'🐶','猫':'🐱','うさぎ':'🐰','鳥':'🐦','ハムスター':'🐹','その他':'🐾'})[t]||'🐾'}
function current(){return state.pets.find(p=>p.id===state.selected)||null}
function ageText(date){if(!date)return '未登録';const b=new Date(date+'T00:00:00'),n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}return y>0?`${y}歳${m}か月`:`${Math.max(m,0)}か月`}
function fmtDate(d){if(!d)return '未登録';const [y,m,day]=d.split('-');return `${y}/${m}/${day}`}
function render(){renderStrip();renderProfile();renderStats();renderPagePetSummaries();renderWeights();renderCare()}
function renderPagePetSummaries(){const p=current();['#weightPetSummary','#carePetSummary'].forEach(sel=>{const el=$(sel);if(!el)return;if(!p){el.innerHTML='<div class="page-avatar">🐾</div><div><b>ペットが未登録です</b><small>下の「ペット追加」から登録してください</small></div>';return}el.innerHTML=`${p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`:`<div class="page-avatar">${petEmoji(p.type)}</div>`}<div><b>${esc(p.name)}</b><small>${esc(p.type||'ペット')} の記録</small></div>`})}
function renderStrip(){const el=$('#petStrip');el.innerHTML=state.pets.map(p=>`<button class="pet-chip ${p.id===state.selected?'active':''}" data-id="${p.id}">${p.photo?`<img src="${p.photo}" alt="">`:`<div class="avatar">${petEmoji(p.type)}</div>`}<b>${esc(p.name)}</b></button>`).join('');el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;save();render()})}
function renderProfile(){const p=current(),el=$('#profileArea');if(!p){el.innerHTML=`<div class="empty"><div class="big">🐶🐱</div><h2>ペットを登録しよう</h2><p class="muted">何頭でも登録して、ひとりずつ記録できます。</p><button class="btn" onclick="openPetModal()">＋ 最初のペットを登録</button></div>`;return} el.innerHTML=`<div class="profile">${p.photo?`<img class="profile-photo" src="${p.photo}" alt="${esc(p.name)}">`:`<div class="profile-photo">${petEmoji(p.type)}</div>`}<div><h2>${esc(p.name)}</h2><div class="chips"><span class="tag">${esc(p.type||'ペット')}</span><span class="tag">🎂 ${ageText(p.birthday)}</span>${p.food?`<span class="tag">🍎 ${esc(p.food)}</span>`:''}</div>${p.memo?`<p class="muted" style="font-size:13px;margin:10px 0 0">${esc(p.memo)}</p>`:''}</div></div>`}
function renderStats(){const p=current(),el=$('#profileStats');if(!p){el.innerHTML='<div class="muted">ペットを登録すると表示されます。</div>';return}const weights=[...(p.weights||[])].sort((a,b)=>a.date.localeCompare(b.date));const last=weights.at(-1); el.innerHTML=`<div class="stat"><span class="label">生年月日</span><strong>${fmtDate(p.birthday)}</strong></div><div class="stat"><span class="label">最新体重</span><strong>${last?last.value+' kg':'未記録'}</strong></div><div class="stat"><span class="label">好きな食べ物</span><strong style="font-size:15px">${esc(p.food||'未登録')}</strong></div><div class="stat"><span class="label">体重記録</span><strong>${weights.length}回</strong></div>`}
function renderWeights(){const p=current(),hist=$('#weightHistory'),wrap=$('#chartWrap');if(!p){wrap.innerHTML='<div class="empty"><div class="big">📈</div><p class="muted">ペットを登録すると体重を記録できます。</p></div>';hist.innerHTML='';return} const arr=[...(p.weights||[])].sort((a,b)=>a.date.localeCompare(b.date)); drawChart(arr,wrap); hist.innerHTML=arr.length?[...arr].reverse().map((w,i)=>`<div class="row"><span>📅 ${fmtDate(w.date)}</span><strong>${w.value} kg</strong><button class="delete" data-wid="${w.id}">削除</button></div>`).join(''):'<div class="muted">まだ体重記録がありません。</div>'; hist.querySelectorAll('[data-wid]').forEach(b=>b.onclick=()=>{const pet=current();if(!pet)return;if(confirm('この体重データを本当に削除しますか？')){pet.weights=(pet.weights||[]).filter(w=>w.id!==b.dataset.wid);save();renderWeights();renderStats()}})}
function fmtDateTime(v){if(!v)return '未登録';const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function safePhone(v=''){return String(v).replace(/[^0-9+*#,-]/g,'')}
function renderCare(){const p=current(),el=$('#careList');if(!p){el.innerHTML='<div class="muted">ペットを登録すると、ワクチンや通院の予定・記録を管理できます。</div>';return}const arr=[...(p.care||[])].sort((a,b)=>{if(a.status!==b.status)return a.status==='予定'?-1:1;return a.status==='予定'?a.date.localeCompare(b.date):b.date.localeCompare(a.date)});if(!arr.length){el.innerHTML='<div class="muted">まだ予定・記録がありません。</div>';return}el.innerHTML=arr.map(c=>`<div class="medical-card"><div class="medical-top"><div><div class="medical-title">${c.type==='ワクチン接種'?'💉':c.type==='通院'?'🏥':c.type==='健康診断'?'🩺':c.type==='投薬'?'💊':'🐾'} ${esc(c.type)}</div><div class="medical-date">📅 ${fmtDateTime(c.date)}</div></div><span class="status-badge ${c.status==='予定'?'plan':'done'}">${esc(c.status)}</span></div><div class="medical-info">${c.hospitalName?`<div>🏥 ${esc(c.hospitalName)}</div>`:''}${c.hospitalAddress?`<div>📍 ${esc(c.hospitalAddress)}</div>`:''}${c.hospitalPhone?`<div>☎️ <a href="tel:${safePhone(c.hospitalPhone)}">${esc(c.hospitalPhone)}</a></div>`:''}</div>${c.memo?`<div class="medical-note">${esc(c.memo)}</div>`:''}<div class="medical-actions"><button class="mini-btn" data-care-edit="${c.id}">✏️ 変更</button><button class="mini-btn delete-care" data-care-delete="${c.id}">🗑️ 削除</button></div></div>`).join('');el.querySelectorAll('[data-care-edit]').forEach(b=>b.onclick=()=>openCareModal(b.dataset.careEdit));el.querySelectorAll('[data-care-delete]').forEach(b=>b.onclick=()=>{const item=(p.care||[]).find(x=>x.id===b.dataset.careDelete);if(item&&confirm(`${item.type} の予定・記録を本当に削除しますか？`)){p.care=p.care.filter(x=>x.id!==item.id);save();renderCare()}})}
function defaultLocalDateTime(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function openCareModal(id=null){const p=current();if(!p){openPetModal();return}editingCareId=id;const c=id?(p.care||[]).find(x=>x.id===id):null;$('#careModalTitle').textContent=c?'予定・記録を変更':'予定・記録を追加';$('#careStatus').value=c?.status||'予定';$('#careType').value=c?.type||'ワクチン接種';$('#careDate').value=c?.date||defaultLocalDateTime();$('#hospitalName').value=c?.hospitalName||'';$('#hospitalAddress').value=c?.hospitalAddress||'';$('#hospitalPhone').value=c?.hospitalPhone||'';$('#careMemo').value=c?.memo||'';$('#deleteCareBtn').style.display=c?'block':'none';$('#careModal').classList.add('show')}
function closeCareModal(){$('#careModal').classList.remove('show')}
function drawChart(arr,el){if(!arr.length){el.innerHTML='<div class="empty"><div class="big">⚖️</div><p class="muted">体重を記録すると、ここにグラフが表示されます。</p></div>';return}const W=700,H=230,pad={l:54,r:18,t:22,b:40};let vals=arr.map(x=>+x.value),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=.5;max+=.5}else{const d=(max-min)*.18;min=Math.max(0,min-d);max+=d} const x=i=>pad.l+(arr.length===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(arr.length-1)), y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/(max-min); let grid='',labels='';for(let i=0;i<5;i++){const gy=pad.t+i*(H-pad.t-pad.b)/4,gv=max-i*(max-min)/4;grid+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#efdfe6" stroke-width="1"/><text x="${pad.l-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#9b8490">${gv.toFixed(1)}</text>`} arr.forEach((a,i)=>{if(arr.length<=6||i===0||i===arr.length-1||i%Math.ceil(arr.length/5)===0)labels+=`<text x="${x(i)}" y="${H-13}" text-anchor="middle" font-size="10" fill="#9b8490">${a.date.slice(5).replace('-','/')}</text>`}); const pts=arr.map((a,i)=>`${x(i)},${y(+a.value)}`).join(' '),circles=arr.map((a,i)=>`<circle cx="${x(i)}" cy="${y(+a.value)}" r="5" fill="#ff88b2" stroke="#fff" stroke-width="3"><title>${a.date}: ${a.value} kg</title></circle>`).join(''); el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb7" stop-opacity=".28"/><stop offset="1" stop-color="#ff8fb7" stop-opacity=".02"/></linearGradient></defs>${grid}${arr.length>1?`<polygon points="${pts} ${x(arr.length-1)},${H-pad.b} ${x(0)},${H-pad.b}" fill="url(#area)"/><polyline points="${pts}" fill="none" stroke="#ff7eac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`:''}${circles}${labels}<text x="10" y="15" font-size="11" fill="#9b8490">kg</text></svg>`}
function openPetModal(id=null){editingId=id;const p=id?state.pets.find(x=>x.id===id):null;pendingPhoto=p?.photo||'';$('#modalTitle').textContent=p?'ペット情報を編集':'ペットを登録';$('#petName').value=p?.name||'';$('#petType').value=p?.type||'犬';$('#petBirthday').value=p?.birthday||'';$('#petFood').value=p?.food||'';$('#petMemo').value=p?.memo||'';$('#petPhoto').value='';updatePreview(p?.type||'犬');$('#deletePetBtn').style.display=p?'block':'none';$('#petModal').classList.add('show')}
function closePetModal(){$('#petModal').classList.remove('show')}
function updatePreview(type){const pr=$('#photoPreview');if(pendingPhoto){pr.innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:26px">`}else pr.textContent=petEmoji(type)}
$('#petType').onchange=e=>updatePreview(e.target.value);$('#petPhoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),max=900,s=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.82);updatePreview($('#petType').value)};img.src=ev.target.result};r.readAsDataURL(f)}
$('#petForm').onsubmit=e=>{e.preventDefault();const data={name:$('#petName').value.trim(),type:$('#petType').value,birthday:$('#petBirthday').value,food:$('#petFood').value.trim(),memo:$('#petMemo').value.trim(),photo:pendingPhoto};if(!data.name)return;if(editingId){const p=state.pets.find(x=>x.id===editingId);Object.assign(p,data)}else{const p={id:uid(),...data,weights:[],care:[]};state.pets.push(p);state.selected=p.id}save();closePetModal();render()}
$('#deletePetBtn').onclick=()=>{if(!editingId)return;const p=state.pets.find(x=>x.id===editingId);if(confirm(`${p.name} の登録情報を削除しますか？`)){state.pets=state.pets.filter(x=>x.id!==editingId);state.selected=state.pets[0]?.id||null;save();closePetModal();render()}}
$('#closeModal').onclick=closePetModal;$('#petModal').onclick=e=>{if(e.target.id==='petModal')closePetModal()};
function showView(name){const views={home:'#homeView',weight:'#weightView',care:'#careView'},navs={home:'#navHome',weight:'#navWeight',care:'#navCare'};Object.values(views).forEach(sel=>$(sel)?.classList.remove('active'));Object.values(navs).forEach(sel=>$(sel)?.classList.remove('active'));$(views[name])?.classList.add('active');$(navs[name])?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
$('#editPetBtn').onclick=()=>{const p=current();if(p)openPetModal(p.id)};$('#navHome').onclick=()=>showView('home');$('#navAdd').onclick=()=>openPetModal();$('#navWeight').onclick=()=>showView('weight');$('#navCare').onclick=()=>showView('care');$('#addCareBtn').onclick=()=>openCareModal();
$('#careForm').onsubmit=e=>{e.preventDefault();const p=current();if(!p)return;const data={status:$('#careStatus').value,type:$('#careType').value,date:$('#careDate').value,hospitalName:$('#hospitalName').value.trim(),hospitalAddress:$('#hospitalAddress').value.trim(),hospitalPhone:$('#hospitalPhone').value.trim(),memo:$('#careMemo').value.trim()};if(!data.date){alert('日時を入力してください。');return}p.care=p.care||[];if(editingCareId){const c=p.care.find(x=>x.id===editingCareId);if(c)Object.assign(c,data)}else{p.care.push({id:uid(),...data})}save();closeCareModal();renderCare()}
$('#deleteCareBtn').onclick=()=>{const p=current();if(!p||!editingCareId)return;const c=(p.care||[]).find(x=>x.id===editingCareId);if(c&&confirm(`${c.type} の予定・記録を本当に削除しますか？`)){p.care=p.care.filter(x=>x.id!==editingCareId);save();closeCareModal();renderCare()}}
$('#closeCareModal').onclick=closeCareModal;$('#careModal').onclick=e=>{if(e.target.id==='careModal')closeCareModal()};
$('#addWeightBtn').onclick=()=>{const p=current();if(!p){openPetModal();return}const v=parseFloat($('#weightInput').value),d=$('#weightDate').value;if(!v||v<=0||!d){alert('体重と日付を入力してください。');return}p.weights=p.weights||[];p.weights.push({id:uid(),date:d,value:+v.toFixed(2)});save();$('#weightInput').value='';renderWeights();renderStats()}
$('#weightDate').value=new Date().toISOString().slice(0,10);
load();render();
</script>
</body>
</html>
